<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="/styles/styles.css">
    <link rel="stylesheet" href="/styles/basket.css">
    <title>Корзина | Студенческий буфет</title>
</head>
<body>
    <main class="main basket-page">
        <div class="container basket-container">

            <header class="basket-header">
                <h1 class="basket-title">Корзина</h1>
                <a href="/pages/index.html" class="back-to-menu">
                    <span>Вернуться в меню</span>
                </a>
            </header>

            <div class="basket-content">

                <section class="cart-items-panel" aria-labelledby="cart-panel-title">
                    <div class="cart-panel-header">
                        <h2 id="cart-panel-title" class="cart-panel-title">
                            Товары в корзине
                        </h2>

                        <button type="button" class="clear-cart">
                            <span>Очистить</span>
                            <img width="12" height="12" class="clear-cart-icon" src="https://img.icons8.ru/external-tanah-basah-basic-outline-tanah-basah/48/external-recycle-bin-nature-tanah-basah-basic-outline-tanah-basah.png" alt="basket"/>
                        </button>
                    </div>

                    <div class="cart-items-list">
                        <article class="basket-item">
                            <img src="/img/image.png" alt="Круассан с шоколадом"class="basket-item-image">

                            <div class="basket-item-info">
                                <span class="basket-item-category">Выпечка</span>
                                <h3 class="basket-item-title">Круассан с шоколадом</h3>
                                <p class="basket-item-unit-label">Цена за шт.</p>
                            </div>

                            <div class="quantity-counter" aria-label="Количество товара">
                                <button type="button" class="counter-btn minus" aria-label="Уменьшить количество">−</button>
                                <input type="number"  class="counter-input"  value="2"  min="1" max="99" aria-label="Количество круассанов">
                                <button type="button" class="counter-btn plus" aria-label="Увеличить количество">+</button>
                            </div>

                            <div class="basket-item-details">
                                <button type="button" class="remove-item" aria-label="Удалить круассан из корзины">
                                    <img width="20" height="20" class="remove-item-icon" src="https://img.icons8.ru/external-tanah-basah-basic-outline-tanah-basah/48/external-recycle-bin-nature-tanah-basah-basic-outline-tanah-basah.png" alt="basket"/>
                                </button>
                                <p class="basket-item-total">298₽</p>
                                <p class="basket-item-unit-price">149₽</p>
                            </div>
                        </article>
                    </div>
                </section>

                <aside class="order-summary" aria-label="Итог заказа">
                    <div class="order-total">
                        <h2 class="order-total-title">Итого:</h2>
                        <p class="order-total-price">596₽</p>
                    </div>

                    <div class="cart-count">
                        <p class="cart-count-label">Товаров в корзине:</p>
                        <p class="cart-count-value">2шт.</p>
                    </div>

                    <form class="checkout-form" action="#" method="post">
                        <label for="delivery-location" class="delivery-label">
                            Куда привезти заказ?
                        </label>

                        <select
                            name="delivery-location"
                            id="delivery-location"
                            class="delivery-select"
                            required
                        >
                            <option value="" disabled selected>Кабинет</option>
                            <option value="225">225</option>
                            <option value="415">415</option>
                            <option value="110">110</option>
                        </select>

                        <button type="submit" class="checkout-button ripple-button">
                            <span>Заказать</span>
                        </button>
                    </form>
                </aside>

            </div>

            <!-- Чек заказа -->
            <section class="receipt" aria-labelledby="receipt-title">

                <div class="receipt-success-icon">
                    <img
                        src="/img/succesOrder.png" alt="галочка" class="receipt-success-image"
                    >
                </div>

                <h2 class="receipt-title" id="receipt-title">
                    Заказ оформлен!
                </h2>

                <!-- Список товаров -->
                <div class="receipt-details">
                    <div class="receipt-items">
                        <div class="receipt-item">
                            <span class="receipt-item-name">
                                Круассан с шоколадом (2шт)
                            </span>
                            <span class="receipt-item-dots" aria-hidden="true"></span>
                            <span class="receipt-item-price">298₽</span>
                        </div>
                        <div class="receipt-item">
                            <span class="receipt-item-name">
                                Кофе «Американо» (2шт)
                            </span>
                            <span class="receipt-item-dots" aria-hidden="true"></span>
                            <span class="receipt-item-price">298₽</span>
                        </div>
                    </div>

                    <!-- Итог заказа -->
                    <div class="receipt-summary">
                        <div class="receipt-count">
                            <span class="receipt-label">Всего товаров:</span>
                            <span class="receipt-count-value">4 шт.</span>
                        </div>
                        <div class="receipt-total">
                            <span class="receipt-total-label">Итого:</span>
                            <span class="receipt-total-price">596₽</span>
                        </div>
                    </div>
                </div>
                
                <a href="/pages/index.html" class="receipt-done-button ripple-button"> 
                    <!-- добавьте к пути папку page -->
                    <span>Готово</span>
                </a>
            </section>

        </div>
    </main>
    <script src="/basket.js"></script>
</body>

</html>
