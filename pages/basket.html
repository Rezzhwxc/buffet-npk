<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" href="/favicon/NPK.svg">
    <link rel="stylesheet" href="/styles/styles.css">
    <link rel="stylesheet" href="/styles/basket.css">
    <title>Корзина | Студенческий буфет</title>
</head>
<body>
    <main class="main basket-page">
        <div class="container basket-container">

            <header class="basket-header">
                <h1 class="basket-title">Корзина</h1>
                <a href="/pages/index.html" class="back-to-menu">
                    <span>Вернуться в меню</span>
                </a>
            </header>

            <div class="basket-content">

                <section class="cart-items-panel" aria-labelledby="cart-panel-title">
                    <div class="cart-panel-header">
                        <h2 id="cart-panel-title" class="cart-panel-title">
                            Товары в корзине
                        </h2>

                        <button type="button" class="clear-cart">
                            <span>Очистить</span>
                            <img width="12" height="12" class="clear-cart-icon" src="/img/binn.png" alt="basket"/>
                        </button>
                    </div>

                    <div class="cart-items-list"></div>

                </section>

                <aside class="order-summary" aria-label="Итог заказа">
                    <div class="order-total">
                        <h2 class="order-total-title">Итого:</h2>
                        <p class="order-total-price"></p>
                    </div>

                    <div class="cart-count">
                        <p class="cart-count-label">Товаров в корзине:</p>
                        <p class="cart-count-value"></p>
                    </div>

                    <form class="checkout-form" action="#" method="post">
                        <label for="delivery-location" class="delivery-label">
                            Куда привезти заказ?
                        </label>

                        <div class="custom-select-wrapper">
                            <!-- Видимый инпут для ввода и фильтрации -->
                            <input 
                                type="text" 
                                id="delivery-location-input" 
                                class="delivery-select" 
                                placeholder="Кабинет" 
                                autocomplete="off"
                            >
                            
                            <!-- Скрытый инпут для basket.js -->
                            <input type="hidden" name="delivery-location" id="delivery-location" required>

                            <!-- Выпадающий список -->
                            <ul class="custom-options-list" id="delivery-options-list"></ul>
                        </div>

                        <button type="submit" class="checkout-button ripple-button">
                            <span>Заказать</span>
                        </button>
                    </form>
                </aside>

            </div>

            <!-- Чек заказа -->
            
            <div class="receipt-overlay" id="receiptOverlay" hidden>
                <section
                    class="receipt"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="receipt-title"
                >
                    <div class="receipt-success-icon">
                        <img
                            src="/img/succesOrder.png"
                            alt="Успешно"
                            class="receipt-success-image"
                        >
                    </div>

                    <h2 class="receipt-title" id="receipt-title">
                        Заказ оформлен!
                    </h2>

                    <div class="receipt-details">
                        <div class="receipt-items"></div>

                        <div class="receipt-summary">
                            <div class="receipt-count">
                                <span class="receipt-label">Всего товаров:</span>
                                <span class="receipt-count-value"></span>
                            </div>

                            <div class="receipt-total">
                                <span class="receipt-total-label">Итого:</span>
                                <span class="receipt-total-price"></span>
                            </div>
                        </div>
                    </div>

                    <a
                        href="/pages/index.html"
                        class="receipt-done-button ripple-button"
                    >
                        <span>Готово</span>
                    </a>
                </section>
            </div>


        </div>
    </main>

    <div class="modal-overlay" id="confirmOverlay" hidden>
        <div class="modal" role="dialog" aria-modal="true"
            aria-labelledby="confirmTitle" aria-describedby="confirmText">
            <h2 class="modal-title" id="confirmTitle"></h2>
            <p class="modal-text" id="confirmText"></p>
            <div class="modal-actions">
                <button type="button" class="modal-btn modal-btn-secondary" id="confirmCancel">Отмена</button>
                <button type="button" class="modal-btn modal-btn-primary" id="confirmOk">ОК</button>
            </div>
        </div>
    </div>

    <script src="/cart.js"></script>
    <script src="/basket.js"></script>
</body>

</html>
