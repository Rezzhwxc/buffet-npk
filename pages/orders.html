<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="/styles/styles.css">
    <link rel="stylesheet" href="/styles/orders.css">
    <title>Заказы | Студенческий Буфет</title>
</head>
<body>
    
<main class="orders-page">
    <div class="container">

        <header class="orders-header">
            <h1 class="orders-title">ЗАКАЗЫ</h1>

            <a href="/pages/index.html" class="orders-back">
                Вернуться в меню
            </a>
        </header>

        <section class="orders-list">

            <article class="order-card">
                <div class="order-card-header">
                    <h2>Заказ № 58475</h2>
                    <p>Статус: <span>Принято</span></p>
                </div>

                <div class="order-table">
                    <div class="order-table-header">
                        <span>Товары</span>
                        <span>Цена</span>
                        <span>Кабинет</span>
                    </div>

                    <div class="order-item">
                        <span>Круассан с шоколадом (2шт)</span>
                        <span>298₽</span>
                        <span class="order-cabinet"></span>
                    </div>

                    <div class="order-item">
                        <span>Кофе Американо (350мл) (2шт)</span>
                        <span>298₽</span>
                        <span class="order-cabinet">B201</span>
                    </div>
                </div>

                <div class="order-total">
                    <strong>ИТОГО:</strong>
                    <span class="order-total-line"></span>
                    <strong>596₽</strong>
                </div>
            </article>

        </section>

    </div>
</main>

</body>
</html>
